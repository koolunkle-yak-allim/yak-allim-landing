<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="복약 안내서 사진을 찍으면 약마다 복용 정보를 정리하고 복약 알람을 맞춰 주는 앱, Yak-Allim(약올림)" />
    <meta name="theme-color" content="#F6F8F9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11181C" media="(prefers-color-scheme: dark)" />
    <title>Yak-Allim</title>

    <!-- 저장된 테마를 첫 화면을 그리기 전에 적용해, 새로고침 때 반대 테마가 잠깐 비치지 않게 한다. -->
    <script>
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
