<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="복약 안내서 사진을 찍으면 약마다 복용 정보를 정리하고 복약 알람을 맞춰 주는 앱, Yak-Allim(약올림)" />

    <title>Yak-Allim</title>

    <!-- 앱 런처 아이콘의 캡슐. public/의 파일은 빌드 때 base 경로가 붙는다. -->

    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- 링크 공유 미리보기. og:image와 og:url은 크롤러가 읽도록 절대 주소로 쓴다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yak-Allim" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="Yak-Allim(약올림)" />
    <meta property="og:description" content="복약 안내서 사진을 찍으면 약마다 복용 정보를 정리하고 복약 알람을 맞춰 줍니다." />
    <meta property="og:url" content="https://koolunkle-yak-allim.github.io/yak-allim-landing/" />
    <meta property="og:image" content="https://koolunkle-yak-allim.github.io/yak-allim-landing/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Yak-Allim 앱 아이콘과 '복약 안내서 사진으로 맞추는 복약 알람' 문구" />
    <meta name="twitter:card" content="summary_large_image" />
